<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="Точный калькулятор плотности, петель и рядов для вязания." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Marina — калькулятор вязания</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Marina">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>marina</span>
        </a>
        <div class="topbar-actions">
          <button class="text-button" id="history-button" type="button">История <span id="history-count">0</span></button>
          <button class="language-button" id="language-button" type="button" aria-label="Switch language">EN</button>
        </div>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow" data-i18n="eyebrow">Точный расчёт для спокойного вязания</p>
        <h1 id="page-title" data-i18n="title">Плотность, петли<br />и ряды — без догадок.</h1>
        <p class="intro-copy" data-i18n="intro">Введите данные образца или плотность и получите проверяемый размер готового полотна.</p>
      </section>

      <nav class="mode-switch" aria-label="Calculator mode">
        <button class="mode-button active" data-mode="gauge" type="button" data-i18n="modeGauge">Рассчитать плотность</button>
        <button class="mode-button" data-mode="counts" type="button" data-i18n="modeCounts">Рассчитать петли</button>
      </nav>

      <section class="workspace" id="calculator" aria-live="polite"></section>

      <section class="history-panel" id="history-panel" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="saved">Сохранённые расчёты</p>
            <h2 data-i18n="historyTitle">История</h2>
          </div>
          <button class="text-button" id="clear-history" type="button" data-i18n="clear">Очистить</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <footer class="footer-note"><span class="dot"></span><span data-i18n="offline">Работает офлайн после первого запуска</span></footer>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
